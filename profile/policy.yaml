version: 1
filesystem_policy:
  include_workdir: false
  read_only:
  - /bin
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /etc
  - /opt
  - /var/log
  - /sys/devices/system
  - /PeTTa
  # Bind mounts are separate filesystems. A rule on /PeTTa does not cover them.
  - /PeTTa/repos/Omega/plugins
  - /PeTTa/repos/Omega/library
  read_write:
  - /PeTTa/repos/Omega/memory
  - /PeTTa/repos/Omega/tabletop/data
  - /PeTTa/repos/Omega/campaigns
  - /memory-transfer
  - /tmp
  - /dev/null
  - /opt/huggingface
  - /opt/sentence_transformers
  - /var/tmp
  - /dev/shm
landlock:
  compatibility: best_effort

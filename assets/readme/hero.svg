<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%">
  <title>Gamemaster — Platform-agnostic tabletop RPG game-master runtime</title>
  <desc>A layered architecture separating cognition from mechanics from state for tabletop RPG campaigns.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    .label { fill: #94a3b8; font-size: 13px; letter-spacing: 2.5px; }
    .title { fill: #ffffff; font-size: 68px; font-weight: 700; }
    .tagline { fill: #cbd5e1; font-size: 18px; font-weight: 400; }
    .meta   { fill: #64748b; font-size: 12px; letter-spacing: 1px; }
    .layer-label { fill: #e2e8f0; font-size: 18px; font-weight: 600; }
    .layer-sub   { fill: #94a3b8; font-size: 13px; font-weight: 400; }
    .pip { fill: #f8fafc; }
  </style>

  <!-- background -->
  <rect width="1200" height="380" rx="10" fill="#0f172a"/>

  <!-- left column -->
  <text x="56" y="96" class="label">TABLETOP RPG PLATFORM</text>
  <text x="56" y="164" class="title">GAMEMASTER</text>
  <text x="56" y="200" class="tagline">A platform-agnostic game-master runtime built on Omega</text>
  <text x="56" y="230" class="meta">OPEN SOURCE · GAME-SYSTEM PLUGINS · EVENT-SOURCED CAMPAIGNS · RULES RAG</text>

  <!-- dice motif — two d6 dice, bottom-left -->
  <!-- die showing 4 -->
  <g transform="translate(72,260)">
    <rect width="40" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <circle cx="10" cy="10" r="3" class="pip" fill="#f59e0b"/>
    <circle cx="30" cy="10" r="3" class="pip" fill="#f59e0b"/>
    <circle cx="10" cy="30" r="3" class="pip" fill="#f59e0b"/>
    <circle cx="30" cy="30" r="3" class="pip" fill="#f59e0b"/>
  </g>
  <!-- die showing 6 -->
  <g transform="translate(124,260)">
    <rect width="40" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <circle cx="10" cy="10" r="3" class="pip" fill="#f59e0b"/>
    <circle cx="30" cy="10" r="3" class="pip" fill="#f59e0b"/>
    <circle cx="10" cy="20" r="3" class="pip" fill="#f59e0b"/>
    <circle cx="30" cy="20" r="3" class="pip" fill="#f59e0b"/>
    <circle cx="10" cy="30" r="3" class="pip" fill="#f59e0b"/>
    <circle cx="30" cy="30" r="3" class="pip" fill="#f59e0b"/>
  </g>

  <!-- right column — architecture stack -->
  <!-- 5 layers: 1060px wide each, stacked vertically -->
  <g transform="translate(580,72)">
    <!-- Layer 1: Omega -->
    <rect x="0" y="0" width="560" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="50" rx="2" fill="#f59e0b"/>
    <text x="22" y="22" class="layer-label">Omega</text>
    <text x="22" y="38" class="layer-sub">Cognition · Tools · Model Interaction</text>
    <text x="480" y="30" class="meta" text-anchor="end">LAYER 1</text>

    <!-- connector -->
    <circle cx="280" cy="62" r="2.5" fill="#f59e0b"/>
    <rect x="279" y="52" width="2" height="10" fill="#334155"/>

    <!-- Layer 2: Tabletop Runtime -->
    <rect x="0" y="70" width="560" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="70" width="4" height="50" rx="2" fill="#f59e0b"/>
    <text x="22" y="92" class="layer-label">Tabletop Runtime</text>
    <text x="22" y="108" class="layer-sub">Orchestration · Persistence · Visibility · Events</text>
    <text x="480" y="90" class="meta" text-anchor="end">LAYER 2</text>

    <!-- connector -->
    <circle cx="280" cy="132" r="2.5" fill="#f59e0b"/>
    <rect x="279" y="122" width="2" height="10" fill="#334155"/>

    <!-- Layer 3: Game System Plugins -->
    <rect x="0" y="140" width="560" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="140" width="4" height="50" rx="2" fill="#f59e0b"/>
    <text x="22" y="162" class="layer-label">Game System Plugins</text>
    <text x="22" y="178" class="layer-sub">Freeform · D&amp;D 5e · GURPS · Future Systems</text>
    <text x="480" y="160" class="meta" text-anchor="end">LAYER 3</text>

    <!-- connector -->
    <circle cx="280" cy="202" r="2.5" fill="#f59e0b"/>
    <rect x="279" y="192" width="2" height="10" fill="#334155"/>

    <!-- Layer 4: Content Packs -->
    <rect x="0" y="210" width="560" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="210" width="4" height="50" rx="2" fill="#f59e0b"/>
    <text x="22" y="232" class="layer-label">Content Packs</text>
    <text x="22" y="248" class="layer-sub">Rules · Settings · Adventures · Sourcebooks</text>
    <text x="480" y="230" class="meta" text-anchor="end">LAYER 4</text>

    <!-- connector -->
    <circle cx="280" cy="272" r="2.5" fill="#f59e0b"/>
    <rect x="279" y="262" width="2" height="10" fill="#334155"/>

    <!-- Layer 5: Campaign State -->
    <rect x="0" y="280" width="560" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="280" width="4" height="50" rx="2" fill="#f59e0b"/>
    <text x="22" y="302" class="layer-label">Campaign State</text>
    <text x="22" y="318" class="layer-sub">Events · Facts · Relationships · Source Provenance</text>
    <text x="480" y="300" class="meta" text-anchor="end">LAYER 5</text>
  </g>
</svg>